# CD(Publish container)가 main 에서 성공하면, '배포 대기' 라벨이 붙은 Jira 작업을 Done 으로 바꾼다.
# 실습 2 에서 PR 전에 만드는 cd-container.yml 의 name 이 "Publish container" 여야 이 워크플로가 깨어난다.
name: Jira deploy
on:
  workflow_run:
    workflows: ["Publish container"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  done:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포 대기 작업을 Done 으로
        run: |
          J=.github/scripts/jira.sh
          JQL="labels = deploy-pending AND statusCategory != Done"
          [ -n "$JIRA_PROJECT" ] && JQL="$JQL AND project = $JIRA_PROJECT"
          keys=$(bash "$J" search "$JQL")   # 접근 실패면 여기서 스텝이 실패한다
          [ -n "$keys" ] || echo "deploy-pending 라벨이 붙은 작업 없음 — 바꿀 것 없음"
          for key in $keys; do
            bash "$J" comment "$key" "배포 완료: ghcr.io/${GITHUB_REPOSITORY,,}:$SHA ($RUN_URL)"
            bash "$J" move "$key" "Done"
            bash "$J" label "$key" remove deploy-pending
            echo "$key → Done"
          done
