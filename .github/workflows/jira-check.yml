# 이 저장소의 Actions 가 Jira 에 닿는지 점검한다. Actions → Jira check → Run workflow (키는 선택).
name: Jira check
on:
  workflow_dispatch:
    inputs:
      key:
        description: "확인할 Jira 키 (예: KAN-5, 비워도 됨)"
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
      KEY: ${{ inputs.key }}
    steps:
      - name: 시크릿 · 인증 · 작업 확인
        run: |
          fail=0
          for v in JIRA_BASE_URL JIRA_EMAIL JIRA_API_TOKEN; do
            if [ -n "${!v}" ]; then echo "✅ 시크릿 $v 있음"; else echo "::error::시크릿 $v 없음"; fail=1; fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "변수 JIRA_PROJECT = ${JIRA_PROJECT:-(없음)}"
          BASE=${JIRA_BASE_URL%/}
          echo "JIRA_BASE_URL 호스트 = $(sed -E 's#https?://([^/]+).*#\1#' <<<"$BASE")"
          j() { curl -sS --max-time 30 -o out.json -w '%{http_code}' -u "$JIRA_EMAIL:$JIRA_API_TOKEN" "$@" || echo 000; }
          code=$(j "$BASE/rest/api/2/myself")
          if [ "$code" != 200 ]; then
            echo "::error::인증 실패 (GET /myself → HTTP $code) — 401 은 이메일 · 토큰, 000 · 404 는 JIRA_BASE_URL 확인"; exit 1
          fi
          echo "✅ 로그인: $(jq -r .displayName out.json)"
          if [ -n "$JIRA_PROJECT" ]; then
            code=$(j "$BASE/rest/api/2/project/$JIRA_PROJECT")
            [ "$code" = 200 ] && echo "✅ 프로젝트 $JIRA_PROJECT: $(jq -r .name out.json)" || { echo "::error::프로젝트 $JIRA_PROJECT 를 볼 수 없음 (HTTP $code)"; exit 1; }
          fi
          if [ -n "$KEY" ]; then
            code=$(j "$BASE/rest/api/2/issue/$KEY?fields=summary,status,labels")
            [ "$code" = 200 ] || { echo "::error::$KEY 를 볼 수 없음 (HTTP $code) — 키 · 사이트 확인"; exit 1; }
            jq -r '"✅ \(.key): \(.fields.summary) — 상태 \(.fields.status.name), 라벨 \(.fields.labels)"' out.json
            j "$BASE/rest/api/2/issue/$KEY/transitions" >/dev/null
            echo "갈 수 있는 상태: $(jq -r '[.transitions[].to.name] | join(", ")' out.json)"
          fi
